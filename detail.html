<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <title>Detail Movie</title>
</head>

<body class="bg-black">

  <nav class="bg-neutral-900 p-4">
